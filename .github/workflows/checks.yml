name: Generator checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/generator.cjs
      - run: node tests/positions.cjs
      - run: node tests/race-options.cjs
      - run: node tests/kart-size.cjs
      - run: node tests/first-person.cjs
